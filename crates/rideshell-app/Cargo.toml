[package]
name = "rideshell-app"
description = "RideShell App: the RideShell terminal window (tabs, accounts, launchers)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "rideshell-app"
path = "src/main.rs"

[dependencies]
rideshell-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dunce.workspace = true
which.workspace = true
wry.workspace = true
tao.workspace = true
portable-pty.workspace = true
base64.workspace = true
rfd.workspace = true
png.workspace = true
dirs.workspace = true
# Verifying downloaded updates against their published SHA-256.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Media controls (Spotify in the status bar). Same version wry already uses.
windows = { version = "0.62", default-features = false, features = ["std", "Media_Control"] }
winreg.workspace = true

[build-dependencies]
embed-resource.workspace = true
