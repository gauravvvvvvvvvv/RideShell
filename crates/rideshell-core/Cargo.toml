[package]
name = "rideshell-core"
description = "Core library for RideShell: profiles, bindings, resolution, environment isolation and shell adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
dunce.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
which.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }
# Build libdbus into the binary (keyring's Secret Service client uses it), so
# the Linux binary runs without libdbus installed. Only libdbus, no OpenSSL.
dbus = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile.workspace = true
