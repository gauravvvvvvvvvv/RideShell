[workspace]
resolver = "2"
members = ["crates/rideshell-core", "crates/rideshell-cli", "crates/rideshell-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/gauravvvvvvvvvv/RideShell"

[workspace.dependencies]
rideshell-core = { path = "crates/rideshell-core" }
anyhow = "1"
anstream = "0.6"
anstyle = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
dunce = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"
rpassword = "7"
keyring = "3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wry = "0.57"
tao = "0.37"
portable-pty = "0.9"
base64 = "0.22"
embed-resource = "3"
png = "0.18"
rfd = { version = "0.18", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
